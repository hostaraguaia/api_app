services:
  # 🔹 APP - Laravel + PHP-FPM
  app:
    container_name: Apicatholic-app-laravel-12
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PHP_MEMORY_LIMIT=2G
      - PHP_UPLOAD_MAX_FILESIZE=1G
      - PHP_POST_MAX_SIZE=1G
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 1024M
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - redis
      - db
    networks:
      - catholic

  # 🔹 NGINX - Servidor Web
  nginx:
    container_name: Apicatholic-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - ./:/var/www
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf # ADICIONE ESTA LINHA
      - /etc/letsencrypt:/etc/letsencrypt:ro # ADICIONE ESTA LINHA
    #- ./public:/var/www/public
    # - ./logs/nginx:/var/log/nginx
    networks:
      - catholic

  # 🔹 POSTGRES - Banco de dados
  db:
    container_name: Apicatholic-db
    image: postgres:15
    restart: unless-stopped
    environment:
      PGPASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_USER: "${DB_USERNAME}"
    deploy:
      resources:
        limits:
          memory: 8192M
        reservations:
          memory: 4096M
    volumes:
      - ./.docker/postgresql/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - catholic

  # 🔹 REDIS - Cache e fila
  redis:
    container_name: Apicatholic-redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "1gb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - catholic

  # 🔹 PGADMIN - Admin do PostgreSQL
  pgadmin:
    container_name: Apicatholic-pgadmin
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-ti@hostaraguaia.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-hostaraguaia}
    ports:
      - "9081:80"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - catholic

networks:
  catholic:
    driver: bridge
