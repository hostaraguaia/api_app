[PHP]
; post_max_size = 300000M
; upload_max_filesize = 300000M
; memory_limit = 300000M
; max_execution_time = 300000M
; max_input_time = 300000M


memory_limit = 10G

; Tamanho máximo de upload de arquivo
upload_max_filesize = 30G

; Tamanho máximo de dados POST (deve ser maior que upload_max_filesize)
post_max_size = 30G

; Tempo limite para upload (em segundos) - 30 minutos
max_execution_time = 1800

; Tempo limite para input (em segundos) - 30 minutos
max_input_time = 1800

; Número máximo de arquivos que podem ser enviados simultaneamente
max_file_uploads = 100

; Tamanho máximo de variáveis de input
max_input_vars = 19000
