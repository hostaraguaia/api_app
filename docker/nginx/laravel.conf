server {
    listen 80;
    server_name beatify.com.br www.beatify.com.br;

    index index.php index.html;
    root /var/www/public;

    # Redirecionar HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name beatify.com.br www.beatify.com.br;

    index index.php index.html;
    root /var/www/public;

    # Certificados SSL - CORRIGIDO
    ssl_certificate /etc/letsencrypt/live/beatify.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatify.com.br/privkey.pem;

    # Configurações SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Configurações de upload
    client_max_body_size 51g;
    client_body_buffer_size 512k;
    client_body_in_file_only clean;

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts para uploads grandes
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Negar acesso a arquivos ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
